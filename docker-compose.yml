services:
  backend:
    build: ./backend
    container_name: ai_backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/analytics
      - SECRET_KEY=super-secret-jwt-key-change-in-production-32chars!
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_LLM_MODEL=tinyllama
      - OLLAMA_SQL_MODEL=llama3.2:3b
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - OPIK_API_KEY=${OPIK_API_KEY:-}
      - OPIK_PROJECT_NAME=rave-analytics-rag
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: ai_frontend
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    ports:
      - "8501:8501"
    profiles:
      - legacy

  reflex:
    build: ./reflex-app
    container_name: rave_reflex
    restart: on-failure
    depends_on:
      - backend
    environment:
      - FASTAPI_URL=http://backend:8000
      - REFLEX_ENV=dev
      - REFLEX_HOST=0.0.0.0
      - REFLEX_PORT=3000
    ports:
      - "3000:3000"
      - "8001:8001"
    volumes:
      - ./reflex-app:/app
      - reflex_cache:/.reflex

  db:
    image: pgvector/pgvector:pg15
    container_name: analytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama
    environment:
      - OLLAMA_NUM_THREAD=4          # cap CPU threads (was using all cores)
      - OLLAMA_MAX_LOADED_MODELS=1   # keep only 1 model in RAM at a time
      - OLLAMA_FLASH_ATTENTION=1     # faster attention on CPU
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
        ollama serve &
        sleep 10 &&
        ollama pull nomic-embed-text &&
        ollama pull tinyllama &&
        ollama pull llama3.2:3b &&
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  pg_data:
  ollama_data:
  reflex_cache:
